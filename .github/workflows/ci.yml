name: MemFlux Windows CI & Packaging

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-and-package:
    name: Verify & Package (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust stable MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Verify package version consistency
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (($pkg -ne $tauri) -or ($pkg -ne $cargo)) {
            Write-Error "Version mismatch: package.json=$pkg, tauri.conf.json=$tauri, Cargo.toml=$cargo"
            exit 1
          }
          Write-Host "Version consistency verified: $pkg"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust Clippy (warnings denied)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust unit & native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows release executable & installer bundle
        run: npm run tauri build

      - name: Generate SHA-256 checksums for release artifacts
        shell: pwsh
        run: |
          $outDir = "src-tauri/target/release"
          $checksumFile = "$outDir/SHA256SUMS.txt"
          $files = @("$outDir/memflux.exe")
          if (Test-Path "$outDir/bundle") {
            $bundleFiles = Get-ChildItem -Path "$outDir/bundle" -Recurse -File -Include *.exe,*.msi
            $files += $bundleFiles.FullName
          }
          $lines = foreach ($f in $files) {
            if (Test-Path $f) {
              $hash = (Get-FileHash -Path $f -Algorithm SHA256).Hash
              $rel = Resolve-Path -Path $f -Relative
              "$hash  $rel"
            }
          }
          $lines | Set-Content -Path $checksumFile -Encoding UTF8
          Get-Content $checksumFile

      - name: Upload unsigned Windows build & installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memflux-windows-x64-unsigned
          if-no-files-found: error
          path: |
            src-tauri/target/release/memflux.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/SHA256SUMS.txt
